services:

  # ─── Database ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: psyduck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_user -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: psyduck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wordpress_root_pwd
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress_user
      MYSQL_PASSWORD: wordpress_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwordpress_user", "-pwordpress_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    container_name: psyduck-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wordpress_user
      WORDPRESS_DB_PASSWORD: wordpress_pwd
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./infra/wp-bootstrap.sh:/usr/local/bin/wp-bootstrap.sh
    entrypoint: ["bash", "-c", "/usr/local/bin/wp-bootstrap.sh & docker-entrypoint.sh apache2-foreground"]
    # Healthy only after wp-bootstrap.sh activates WPGraphQL — the /graphql
    # endpoint doesn't exist until that plugin is installed and active.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{__typename}\"}' | grep -q __typename"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: psyduck-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Subgraphs ────────────────────────────────────────────────────────────────

  users:
    build: .
    container_name: psyduck-users
    working_dir: /app/apps/users
    command: npx ts-node -r tsconfig-paths/register src/main.ts
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: users_user
      DB_PASSWORD: users_pwd
      NODE_ENV: development
      # BETTER_AUTH_URL uses localhost so browser-side OAuth flows work via the
      # host port mapping (the URL is embedded in OIDC discovery documents).
      BETTER_AUTH_URL: http://localhost:4001
      BETTER_AUTH_SECRET: dev-better-auth-secret-change-in-prod
      AI_OAUTH_CLIENT_ID: ai-companion
      AI_OAUTH_CLIENT_SECRET: companion-dev-secret
      AI_OAUTH_REDIRECT_URL: http://localhost:4004/auth/callback
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({hostname:'localhost',port:4001,path:'/graphql'},(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  products:
    build: .
    container_name: psyduck-products
    working_dir: /app/apps/products
    command: npx ts-node src/index.ts
    ports:
      - "4002:4002"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      PORT: 4002
      WP_GRAPHQL_URL: http://wordpress/graphql
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({hostname:'localhost',port:4002,path:'/graphql'},(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  payments:
    build:
      context: ./apps/payments-go
      dockerfile: Dockerfile
    container_name: psyduck-payments
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PORT: 4003
      VALKEY_ADDR: valkey:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payments_db
      DB_USER: users_user
      DB_PASSWORD: users_pwd
      PRODUCTS_SUBGRAPH_URL: http://products:4002/graphql
      USERS_AUTH_URL: http://users:4001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/graphql || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  companion:
    build: .
    container_name: psyduck-companion
    working_dir: /app/apps/companion
    command: npx ts-node src/index.ts
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: companion_db
      DB_USER: users_user
      DB_PASSWORD: users_pwd
      USERS_AUTH_URL: http://users:4001
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({hostname:'localhost',port:4004,path:'/graphql'},(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Gateway ─────────────────────────────────────────────────────────────────
  # Starts last — waits for all four subgraphs to be healthy before composing
  # the federated schema via IntrospectAndCompose.

  gateway:
    build: .
    container_name: psyduck-gateway
    working_dir: /app/apps/gateway
    command: npx ts-node src/main.ts
    ports:
      - "4000:4000"
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      payments:
        condition: service_healthy
      companion:
        condition: service_healthy
    environment:
      PORT: 4000
      USERS_SUBGRAPH_URL: http://users:4001/graphql
      PRODUCTS_SUBGRAPH_URL: http://products:4002/graphql
      PAYMENTS_SUBGRAPH_URL: http://payments:4003/graphql
      AI_SUBGRAPH_URL: http://companion:4004/graphql
      USERS_AUTH_URL: http://users:4001
      AI_OAUTH_CLIENT_ID: ai-companion
      AI_OAUTH_CLIENT_SECRET: companion-dev-secret
      AI_OAUTH_REDIRECT_URL: http://localhost:4004/auth/callback

  # ─── Web ─────────────────────────────────────────────────────────────────────

  web:
    build: .
    container_name: psyduck-web
    working_dir: /app/apps/web
    command: npx next dev -p 3000
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_USE_MOCKS: "false"
      # Browser-facing URL — the host port mapping makes 4000 reachable from outside.
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000/graphql
      # Server-facing URL — used by Next.js SSR/ISR inside the container.
      GATEWAY_URL: http://gateway:4000/graphql

volumes:
  postgres_data:
  mysql_data:
  wp_data:
