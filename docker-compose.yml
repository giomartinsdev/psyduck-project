version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tech-challenge-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wordpress_root_pwd
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress_user
      MYSQL_PASSWORD: wordpress_pwd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: tech-challenge-wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress_user
      WORDPRESS_DB_PASSWORD: wordpress_pwd
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./infra/wp-bootstrap.sh:/usr/local/bin/wp-bootstrap.sh
    entrypoint: [ "bash", "-c", "/usr/local/bin/wp-bootstrap.sh & docker-entrypoint.sh apache2-foreground" ]

volumes:
  db_data:
  wp_data:
